<title>Ply Spatial Layouts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #fbfbfd;
    --panel: #ffffff;
    --frame: #c8ccd4;
    --ink: #1f2430;
    --sub: #333a45;
    --muted: #6b7280;
    --box: #3b4252;
    --chip: #f6f7f9;
    --chip-stroke: #9aa2b1;
    --cap: #eceef2;
    --cap-text: #4b5563;
    --profile: #eef2fb;
    --profile-stroke: #5570a8;
    --profile-text: #334b78;
    --c-tested: #eef0f3;
    --c-fuzzed: #d2d7de;
    --c-bounded: #aeb6c2;
    --c-proved: #8792a3;
    --deny: #c9534f;
    --deny-text: #8f2f2c;
    --pin: #fff6d8;
    --pin-stroke: #b08900;
    --pin-text: #7a5c00;
    --shield: #9a7a1f;
    --glass: #5570a8;
    --shadow: #1f2430;
    --accent: #5570a8;
    --seg-on: #1f2430;
    --seg-on-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #15171c;
      --panel: #1c1f27;
      --frame: #333947;
      --ink: #e6e9ef;
      --sub: #98a0ae;
      --muted: #8b93a1;
      --box: #8891a3;
      --chip: #1c1f27;
      --chip-stroke: #6d7686;
      --cap: #252a35;
      --cap-text: #b6bdca;
      --profile: #1d2532;
      --profile-stroke: #5570a8;
      --profile-text: #9fb6dd;
      --c-tested: #242832;
      --c-fuzzed: #333947;
      --c-bounded: #464e60;
      --c-proved: #5b6479;
      --deny: #e8524b;
      --deny-text: #e8524b;
      --pin: #3a3112;
      --pin-stroke: #b08900;
      --pin-text: #e0c26a;
      --shield: #d4b24a;
      --glass: #7f97cc;
      --shadow: #000000;
      --accent: #9fb6dd;
      --seg-on: #e6e9ef;
      --seg-on-text: #15171c;
    }
  }
  :root[data-theme="dark"] {
    --ground: #15171c;
    --panel: #1c1f27;
    --frame: #333947;
    --ink: #e6e9ef;
    --sub: #98a0ae;
    --muted: #8b93a1;
    --box: #8891a3;
    --chip: #1c1f27;
    --chip-stroke: #6d7686;
    --cap: #252a35;
    --cap-text: #b6bdca;
    --profile: #1d2532;
    --profile-stroke: #5570a8;
    --profile-text: #9fb6dd;
    --c-tested: #242832;
    --c-fuzzed: #333947;
    --c-bounded: #464e60;
    --c-proved: #5b6479;
    --deny: #e8524b;
    --deny-text: #e8524b;
    --pin: #3a3112;
    --pin-stroke: #b08900;
    --pin-text: #e0c26a;
    --shield: #d4b24a;
    --glass: #7f97cc;
    --shadow: #000000;
    --accent: #9fb6dd;
    --seg-on: #e6e9ef;
    --seg-on-text: #15171c;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; cursor: grab; }
  #stage canvas.dragging { cursor: grabbing; }

  .bar {
    position: fixed; left: 0; right: 0; top: 0;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 12px 18px;
    background: color-mix(in srgb, var(--ground) 82%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--frame);
    z-index: 2;
  }
  .brand {
    display: flex; flex-direction: column; gap: 1px; min-width: 190px;
  }
  .brand b { font-weight: 600; font-size: 15px; letter-spacing: 0.01em; }
  .brand span { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }

  .seg {
    display: inline-flex; border: 1px solid var(--box); border-radius: 6px; overflow: hidden;
  }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--ink);
    font: 500 13px "IBM Plex Sans", system-ui, sans-serif;
    padding: 7px 13px; cursor: pointer;
    border-right: 1px solid var(--box);
  }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--seg-on-text); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .hint {
    margin-left: auto;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 11px; color: var(--muted);
    letter-spacing: 0.02em;
  }

  .caption {
    position: fixed; left: 18px; bottom: 18px; max-width: 560px;
    padding: 14px 16px;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    border: 1px solid var(--frame);
    border-left: 3px solid var(--accent);
    z-index: 2;
    line-height: 1.5;
  }
  .caption h2 {
    margin: 0 0 4px; font-size: 14px; font-weight: 600; text-wrap: balance;
  }
  .caption h2 small {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-weight: 400; color: var(--muted); font-size: 11px; margin-left: 8px;
  }
  .caption-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  }
  .caption-head h2 { flex: 1 1 auto; min-width: 0; }
  .cap-toggle {
    appearance: none; border: 1px solid var(--box); border-radius: 6px; background: transparent;
    color: var(--ink); font: 500 13px "IBM Plex Sans", system-ui, sans-serif;
    width: 22px; height: 22px; padding: 0; line-height: 1; cursor: pointer; flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cap-toggle:hover { background: var(--chip); }
  .cap-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .caption p { margin: 0; color: var(--sub); }
  .caption p + p { margin-top: 6px; }
  .caption .depth {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 11px; color: var(--muted); margin-top: 8px; letter-spacing: 0.02em;
  }

  @media (max-width: 720px) {
    .hint { display: none; }
    .caption { right: 18px; max-width: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .seg button { transition: none; }
  }
</style>

<div id="stage"></div>

<div class="bar">
  <div class="brand">
    <b>Ply Spatial Layouts</b>
    <span>trading-system.ply.yaml, same boxes, four arrangements</span>
  </div>
  <div class="seg" role="group" aria-label="Layout">
    <button data-layout="cone" aria-pressed="true">Cone tree</button>

</div>

  <div class="caption-head">
    <h2 id="captionTitle"></h2>
    <button type="button" id="captionToggle" class="cap-toggle" aria-expanded="true" aria-controls="captionBody" aria-label="Collapse caption">×</button>
  </div>
  <div id="captionBody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  // ---------- the model: vetting/003-trading-system.ply.yaml, transcribed ----------
  const MODEL = {
    workspace: 'trading-system',
    externals: [
      { id: 'venue', name: 'venue', note: 'the exchange: accepts orders, returns fills; market data source' }
    ],
    components: [
      { id: 'ingest', name: 'ingest', anchor: 'ingest', fns: [], children: [
        { id: 'ingest.feed', name: 'feed', anchor: 'ingest::feed', uses: ['net'],
          fns: [{ name: 'Feed::pump', checks: [] }] },
        { id: 'ingest.ring', name: 'ring', anchor: 'disruptor::spsc', uses: ['unsafe'],
          owns: ['disruptor::spsc::Spsc'], state: { of: 'Spsc', show: ['slots', 'head', 'tail'] }, profile: 'hot_path',
          fns: [
            { name: 'Spsc::try_push', checks: ['bounded(3)'], checkWith: 'T=RawFrame' },
            { name: 'Spsc::try_pop', checks: ['bounded(3)'], checkWith: 'T=RawFrame' }
          ] },
        { id: 'ingest.decoder', name: 'decoder', anchor: 'ingest::decode', pure: true, profile: 'hot_path',
          fns: [{ name: 'decode', checks: ['bounded(2)', 'fuzz(4096)', 'mutate'], examples: 1 }] },
        { id: 'ingest.book', name: 'book', anchor: 'ingest::book', strict: true,
          owns: ['ingest::book::OrderBook'], state: { of: 'OrderBook', show: ['bids', 'asks', 'last'] }, profile: 'hot_path',
          fns: [
            { name: 'OrderBook::apply', checks: ['bounded(2)', 'fuzz(256)', 'mutate'] },
            { name: 'OrderBook::updates', checks: ['bounded(2)'] },
            { name: 'OrderBook::last_px', checks: ['bounded(2)'] }
          ] }
      ] },
      { id: 'strategy', name: 'strategy', anchor: 'strat',
        fns: [{ name: 'Strategy::on_update', checks: ['test'] }],
        children: [
          { id: 'strategy.signals', name: 'signals', anchor: 'strat::signals', pure: true,
            fns: [{ name: 'momentum', checks: ['bounded(2)', 'fuzz(2048)'] }] }
        ] },
      { id: 'risk', name: 'risk', anchor: 'risk', strict: true, owns: ['risk::Limits'],
        fns: [{ name: 'check_order', checks: ['bounded(3)', 'fuzz(4096)', 'mutate'], contract: true }], children: [] },
      { id: 'oms', name: 'oms', anchor: 'oms', owns: ['oms::OrderStore'],
        state: { of: 'OrderStore', show: ['open', 'by_client_id'] },
        fns: [
          { name: 'Oms::submit', checks: ['bounded(2)', 'fuzz(256)'], entry: 'venue', pin: 9 },
          { name: 'Oms::on_fill', checks: ['bounded(2)'] }
        ], children: [] },
      { id: 'gateway', name: 'gateway', anchor: 'gw', uses: ['net'],
        fns: [{ name: 'Gateway::send', checks: [], trusted: true }], children: [] },
      { id: 'pnl', name: 'pnl', anchor: 'pnl', owns: ['pnl::Positions'],
        state: { of: 'Positions', show: ['by_symbol', 'realised'] },
        fns: [{ name: 'Positions::apply_fill', checks: ['bounded(2)', 'fuzz(512)'] }], children: [] }
    ],
    edges: [
      ['ingest.feed', 'ingest.ring', 'call'],
      ['ingest.decoder', 'ingest.ring', 'call'],
      ['ingest.decoder', 'ingest.book', 'call'],
      ['ingest.feed', 'ingest.ring', 'flow', 'RawFrame'],
      ['ingest.ring', 'ingest.decoder', 'flow', 'RawFrame'],
      ['ingest.decoder', 'ingest.book', 'flow', 'Tick'],
      ['strategy', 'ingest.book', 'call'],
      ['strategy', 'oms', 'call'],
      ['oms', 'risk', 'call'],
      ['oms', 'gateway', 'call'],
      ['oms', 'pnl', 'call'],
      ['ingest.book', 'strategy', 'flow', 'BookUpdate'],
      ['strategy', 'oms', 'flow', 'OrderIntent'],
      ['oms', 'gateway', 'flow', 'Order'],
      ['gateway', 'oms', 'flow', 'Fill'],
      ['oms', 'pnl', 'flow', 'Fill'],
      ['gateway', 'venue', 'flow', 'FixMessage'],
      ['venue', 'gateway', 'flow', 'Fill'],
      ['venue', 'ingest.feed', 'flow', 'RawFrame'],
      ['oms', 'venue', 'entry', 'entry']
    ],
    deny: [
      { target: 'gateway', except: 'oms' },
      { target: 'risk', except: 'oms' },
      { target: 'ingest.book', except: 'ingest.decoder, strategy' }
    ],
    // where each top-level component sits in the flow, by longest path from the exchange
    stage: { venue: 0, ingest: 1, strategy: 2, oms: 3, risk: 4, gateway: 4, pnl: 4 }
  };

  // ---------- palette, read from the page's tokens so both themes stay in step ----------
  function palette() {
    const cs = getComputedStyle(document.documentElement);
    const v = n => cs.getPropertyValue(n).trim();
    return {
      ground: v('--ground'), frame: v('--frame'), ink: v('--ink'), sub: v('--sub'), muted: v('--muted'),
      box: v('--box'), chip: v('--chip'), chipStroke: v('--chip-stroke'), cap: v('--cap'), capText: v('--cap-text'),
      profile: v('--profile'), profileStroke: v('--profile-stroke'), profileText: v('--profile-text'),
      ceiling: { tested: v('--c-tested'), fuzzed: v('--c-fuzzed'), bounded: v('--c-bounded'), proved: v('--c-proved') },
      deny: v('--deny'), denyText: v('--deny-text'), pin: v('--pin'), pinStroke: v('--pin-stroke'), pinText: v('--pin-text'),
      shield: v('--shield'), glass: v('--glass'), shadow: v('--shadow'), accent: v('--accent'),
      dark: v('--ground') === '#15171c'
    };
  }

  // ---------- ceiling: strongest check kind per fn, worst-of across a container ----------
  const RANK = { unclaimed: 0, tested: 1, fuzzed: 2, bounded: 3, proved: 4 };
  function fnCeiling(fn) {
    let best = 'unclaimed';
    for (const c of fn.checks) {
      const k = c.startsWith('prove') ? 'proved' : c.startsWith('bounded') ? 'bounded' : c.startsWith('fuzz') ? 'fuzzed' : c === 'test' ? 'tested' : null;
      if (k && RANK[k] > RANK[best]) best = k;
    }
    return best;
  }
  function ceiling(node) {
    const parts = [];
    for (const f of node.fns || []) parts.push(fnCeiling(f));
    for (const c of node.children || []) parts.push(ceiling(c));
    if (!parts.length) return 'unclaimed';
    return parts.reduce((a, b) => RANK[a] <= RANK[b] ? a : b);
  }

  // ---------- pane drawing: the SVG box grammar, on a canvas ----------
  const PX = 0.01; // world units per pane pixel
  const W = 236;
  const DPR = 2;

  function measure(node) {
    let h = 16 + 18 + 14; // padding + name + anchor
    if (node.uses || node.pure || node.profile) h += 22;
    if (node.owns) h += 14;
    if (node.state) h += 14 + node.state.show.length * 14;
    if (node.children && node.children.length && !(node.fns && node.fns.length)) h += 16;
    for (const f of node.fns || []) h += 32 + 4;
    return h + 10;
  }
  function measureExternal() { return 78; }

  function hatch(ctx, P) {
    const c = document.createElement('canvas');
    c.width = c.height = 8 * DPR;
    const g = c.getContext('2d');
    g.scale(DPR, DPR);
    g.strokeStyle = P.dark ? '#3a4150' : '#c8ccd4';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, 8); g.lineTo(8, 0); g.moveTo(-2, 2); g.lineTo(2, -2); g.moveTo(6, 10); g.lineTo(10, 6); g.stroke();
    return ctx.createPattern(c, 'repeat');
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  function shapeGlyph(ctx, x, y, P) {
    // "a shape of your own": two overlapping outlined cells, the commonest field shape here
    ctx.strokeStyle = P.ink; ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 2.5, 7, 7);
    ctx.strokeRect(x + 4.5, y + 0.5, 7, 7);
  }

  function drawPane(node, P) {
    const h = measure(node);
    const c = document.createElement('canvas');
    c.width = W * DPR; c.height = h * DPR;
    const ctx = c.getContext('2d');
    ctx.scale(DPR, DPR);
    const mono = '"IBM Plex Mono", ui-monospace, Menlo, monospace';

    // box + ceiling fill
    const ceil = ceiling(node);
    ctx.fillStyle = ceil === 'unclaimed' ? hatch(ctx, P) : P.ceiling[ceil];
    if (ceil === 'unclaimed') { ctx.save(); ctx.fillStyle = P.chip; ctx.fillRect(0, 0, W, h); ctx.restore(); ctx.fillStyle = hatch(ctx, P); }
    ctx.fillRect(0, 0, W, h);
    ctx.strokeStyle = P.box; ctx.lineWidth = 1.5;
    ctx.strokeRect(0.75, 0.75, W - 1.5, h - 1.5);
    if (node.pure) { ctx.lineWidth = 1; ctx.strokeRect(4.5, 4.5, W - 9, h - 9); }
    if (node.strict) {
      ctx.fillStyle = P.ink; ctx.beginPath(); ctx.moveTo(W - 2, 2); ctx.lineTo(W - 2, 16); ctx.lineTo(W - 16, 2); ctx.closePath(); ctx.fill();
    }

    let y = 12;
    ctx.fillStyle = P.ink; ctx.font = `600 13px ${mono}`; ctx.textBaseline = 'top';
    ctx.fillText(node.name, 12, y); y += 18;
    ctx.fillStyle = P.sub; ctx.font = `10px ${mono}`;
    ctx.fillText(node.anchor, 12, y); y += 14;
    if (node.owns) { ctx.font = `italic 10px ${mono}`; ctx.fillText('owns ' + node.owns.map(s => s.split('::').pop()).join(', '), 12, y); y += 14; }

    if (node.uses || node.pure || node.profile) {
      let x = 12;
      ctx.font = `10px ${mono}`;
      for (const u of node.uses || []) {
        const w = ctx.measureText(u).width + 10;
        ctx.fillStyle = P.cap; roundRect(ctx, x, y + 2, w, 15, 3); ctx.fill();
        ctx.strokeStyle = P.chipStroke; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = P.capText; ctx.fillText(u, x + 5, y + 5);
        x += w + 5;
      }
      if (node.profile) {
        const w = ctx.measureText(node.profile).width + 10;
        ctx.fillStyle = P.profile; roundRect(ctx, x, y + 2, w, 15, 3); ctx.fill();
        ctx.strokeStyle = P.profileStroke; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = P.profileText; ctx.fillText(node.profile, x + 5, y + 5);
        x += w + 5;
      }
      if (node.pure) { ctx.fillStyle = P.sub; ctx.fillText('pure · sealed', x, y + 5); }
      y += 22;
    }

    if (node.state) {
      ctx.fillStyle = P.sub; ctx.font = `10px ${mono}`;
      ctx.fillText('state ' + node.state.of, 12, y); y += 14;
      for (const f of node.state.show) {
        shapeGlyph(ctx, 14, y, P);
        ctx.fillStyle = P.ink; ctx.font = `10px ${mono}`; ctx.fillText(f, 30, y);
        y += 14;
      }
    }

    if (node.children && node.children.length && !(node.fns && node.fns.length)) {
      ctx.fillStyle = P.muted; ctx.font = `10px ${mono}`;
      ctx.fillText(node.children.length + ' components inside', 12, y); y += 16;
    }

    for (const f of node.fns || []) {
      ctx.fillStyle = P.chip; ctx.strokeStyle = P.chipStroke; ctx.lineWidth = 1;
      roundRect(ctx, 12, y, W - 24, 32, 3); ctx.fill(); ctx.stroke();
      if (f.contract) { ctx.fillStyle = P.ink; ctx.fillRect(12, y, 3, 32); }
      ctx.fillStyle = P.ink; ctx.font = `11px ${mono}`;
      ctx.fillText(f.name, 20, y + 6);
      ctx.fillStyle = P.sub; ctx.font = `9px ${mono}`;
      const checks = f.checks.length ? f.checks.join('  ') : 'no checks';
      ctx.fillText(checks, 20, y + 19);
      let rx = W - 20;
      ctx.textAlign = 'right';
      if (f.checkWith) { ctx.fillStyle = P.muted; ctx.font = `9px ${mono}`; ctx.fillText(f.checkWith, rx, y + 19); }
      if (f.examples) { ctx.fillStyle = P.muted; ctx.font = `9px ${mono}`; ctx.fillText('e×' + f.examples, rx, y + 19); }
      if (f.trusted) { ctx.fillStyle = P.shield; ctx.font = `12px ${mono}`; ctx.fillText('⛉', rx, y + 4); }
      if (f.pin) {
        ctx.fillStyle = P.pin; ctx.strokeStyle = P.pinStroke; ctx.beginPath(); ctx.arc(rx - 7, y + 11, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = P.pinText; ctx.font = `600 9px ${mono}`; ctx.textAlign = 'center'; ctx.fillText(String(f.pin), rx - 7, y + 6);
      }
      ctx.textAlign = 'left';
      y += 36;
    }
    return c;
  }

  function drawExternal(ext, P) {
    const h = measureExternal();
    const c = document.createElement('canvas');
    c.width = W * DPR; c.height = h * DPR;
    const ctx = c.getContext('2d'); ctx.scale(DPR, DPR);
    const mono = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
    ctx.fillStyle = P.ground; ctx.fillRect(0, 0, W, h);
    ctx.strokeStyle = P.box; ctx.lineWidth = 1.5; ctx.strokeRect(0.75, 0.75, W - 1.5, h - 1.5);
    ctx.fillStyle = P.ink; ctx.font = `600 13px ${mono}`; ctx.textBaseline = 'top';
    ctx.fillText(ext.name, 12, 12);
    ctx.fillStyle = P.muted; ctx.font = `10px ${mono}`;
    ctx.fillText('outside this codebase', 12, 30);
    ctx.fillStyle = P.sub;
    const words = ext.note.split(' '); let line = '', ly = 46;
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > W - 24) { ctx.fillText(line, 12, ly); ly += 12; line = w; } else line = t;
    }
    ctx.fillText(line, 12, ly);
    return c;
  }

  function textSprite(text, color, P, size = 10, bg = null) {
    const mono = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
    const c = document.createElement('canvas');
    const m = document.createElement('canvas').getContext('2d');
    m.font = `${size}px ${mono}`;
    const tw = Math.ceil(m.measureText(text).width) + 10, th = size + 8;
    c.width = tw * DPR; c.height = th * DPR;
    const ctx = c.getContext('2d'); ctx.scale(DPR, DPR);
    if (bg) { ctx.fillStyle = bg; roundRect(ctx, 0, 0, tw, th, 3); ctx.fill(); }
    ctx.fillStyle = color; ctx.font = `${size}px ${mono}`; ctx.textBaseline = 'middle';
    ctx.fillText(text, 5, th / 2);
    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
    sp.scale.set(tw * PX, th * PX, 1);
    sp.renderOrder = 10;
    return sp;
  }

  // ---------- scene ----------
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
  // scratch camera used only to test candidate framings during fitView's solve —
  // never rendered, never added to the scene
  const fitCam = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
  const root = new THREE.Group();
  scene.add(root);
  const paneGroup = new THREE.Group();
  const edgeGroup = new THREE.Group();
  const decorGroup = new THREE.Group();
  root.add(decorGroup, edgeGroup, paneGroup);

  const nodes = new Map(); // id -> { node, mesh, w, h, isExternal, parent }
  function collect(list, parent) {
    for (const n of list) {
      nodes.set(n.id, { node: n, parent, w: W * PX, h: measure(n) * PX });
      if (n.children) collect(n.children, n.id);
    }
  }
  collect(MODEL.components, null);
  for (const e of MODEL.externals) nodes.set(e.id, { node: e, parent: null, w: W * PX, h: measureExternal() * PX, isExternal: true });

  let P = palette();

  function buildPanes() {
    while (paneGroup.children.length) paneGroup.remove(paneGroup.children[0]);
    for (const rec of nodes.values()) {
      const canvas = rec.isExternal ? drawExternal(rec.node, P) : drawPane(rec.node, P);
      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(rec.w, rec.h), mat);
      mesh.userData.id = rec.node.id;
      // a thin backing so the back face reads as a card, not a mirrored label
      const back = new THREE.Mesh(new THREE.PlaneGeometry(rec.w, rec.h),
        new THREE.MeshBasicMaterial({ color: P.dark ? 0x2a2f3a : 0xe4e7ec, side: THREE.BackSide }));
      back.position.z = -0.002;
      mesh.add(back);
      rec.mesh = mesh;
      paneGroup.add(mesh);
    }
  }

  // ---------- layouts: id -> { p: Vector3, q: Quaternion } ----------
  const Y_UP = new THREE.Vector3(0, 1, 0);
  function facing(angle) { return new THREE.Quaternion().setFromAxisAngle(Y_UP, angle); }
  const FRONT = new THREE.Quaternion();

  function layoutCone() {
    const out = new Map();
    const tops = MODEL.components;
    const circ = tops.reduce((s, c) => s + nodes.get(c.id).w, 0) * 1.45;
    const R = circ / (2 * Math.PI);
    const decor = { kind: 'cone', R, rings: [] };
    tops.forEach((c, i) => {
      const th = (i / tops.length) * Math.PI * 2;
      const rec = nodes.get(c.id);
      const p = new THREE.Vector3(Math.sin(th) * R, 0, Math.cos(th) * R);
      out.set(c.id, { p, q: facing(th) });
      if (c.children && c.children.length) {
        const kids = c.children;
        const kc = kids.reduce((s, k) => s + nodes.get(k.id).w, 0) * 1.9;
        const r = kids.length > 1 ? kc / (2 * Math.PI) : 0;
        const kh = Math.max(...kids.map(k => nodes.get(k.id).h));
        const y = -(rec.h / 2 + 0.45 + kh / 2);
        kids.forEach((k, j) => {
          const a = th + (j / kids.length) * Math.PI * 2 + (kids.length > 1 ? Math.PI : 0);
          const kp = new THREE.Vector3(p.x + Math.sin(a) * r, y, p.z + Math.cos(a) * r);
          out.set(k.id, { p: kp, q: facing(kids.length > 1 ? a : th) });
        });
        decor.rings.push({ cx: p.x, cz: p.z, r, y, apex: new THREE.Vector3(p.x, -rec.h / 2, p.z) });
      }
    });
    // the exchange: outside the cylinder, off the gateway's angle
    const gi = tops.findIndex(c => c.id === 'gateway');
    const th = (gi / tops.length) * Math.PI * 2 + 0.35;
    out.set('venue', { p: new THREE.Vector3(Math.sin(th) * R * 2.05, 0.2, Math.cos(th) * R * 2.05), q: facing(th) });
    return { out, decor };
  }

  function layoutSheets() {
    const out = new Map();
    const GAP = 2.8;
    const decor = { kind: 'sheets', sheets: [] };
    const byStage = {};
    for (const c of MODEL.components) (byStage[MODEL.stage[c.id]] = byStage[MODEL.stage[c.id]] || []).push(c);
    const stages = Object.keys(byStage).map(Number).sort((a, b) => a - b);
    const maxStage = 4;
    // children wrap two-per-row (as the flat layout already does) so a cluster with
    // several children doesn't blow its sheet out much wider than its neighbours
    const rowsFor = kids => Math.min(2, kids.length);
    for (const s of stages) {
      const z = (maxStage / 2 - s) * GAP;
      const group = byStage[s];
      // each cluster is one sheet; several clusters at one stage sit side by side
      const widths = group.map(c => {
        const kids = c.children || [];
        if (!kids.length) return nodes.get(c.id).w;
        const perRow = rowsFor(kids);
        const rowW = perRow * nodes.get(kids[0].id).w + (perRow - 1) * 0.25;
        return Math.max(nodes.get(c.id).w, rowW);
      });
      const total = widths.reduce((a, b) => a + b + 0.8, -0.8);
      let x = -total / 2;
      group.forEach((c, gi) => {
        const sw = widths[gi];
        const rec = nodes.get(c.id);
        const kids = c.children || [];
        const perRow = rowsFor(kids);
        const rows = kids.length ? Math.ceil(kids.length / perRow) : 0;
        const kh = kids.length ? Math.max(...kids.map(k => nodes.get(k.id).h)) : 0;
        const kidsBlockH = rows ? rows * kh + (rows - 1) * 0.25 : 0;
        const topY = kids.length ? rec.h / 2 + 0.35 + kidsBlockH / 2 : 0;
        out.set(c.id, { p: new THREE.Vector3(x + sw / 2, topY, z), q: FRONT.clone() });
        const rowW = perRow * (kids.length ? nodes.get(kids[0].id).w : 0) + (perRow - 1) * 0.25;
        kids.forEach((k, j) => {
          const kr = nodes.get(k.id);
          const row = Math.floor(j / perRow), col = j % perRow;
          const kx = x + sw / 2 - rowW / 2 + col * (kr.w + 0.25) + kr.w / 2;
          const ky = topY - rec.h / 2 - 0.35 - kh / 2 - row * (kh + 0.25);
          out.set(k.id, { p: new THREE.Vector3(kx, ky, z), q: FRONT.clone() });
        });
        const sh = kids.length ? rec.h + 0.35 + kidsBlockH : rec.h;
        decor.sheets.push({ x: x + sw / 2, y: kids.length ? (rec.h + 0.35) / 2 : 0, z, w: sw + 0.5, h: sh + 0.5, label: c.name, stage: s });
        x += sw + 0.8;
      });
    }
    out.set('venue', { p: new THREE.Vector3(0, 0, (maxStage / 2) * GAP + GAP * 0.12), q: FRONT.clone() });
    decor.sheets.push({ x: 0, y: 0, z: (maxStage / 2) * GAP + GAP * 0.12, w: W * PX + 0.5, h: measureExternal() * PX + 0.5, label: 'venue', stage: 0, external: true });
    return { out, decor };
  }

  function layoutCube() {
    const out = new Map();
    const D = 0.9; // box depth
    const decor = { kind: 'cube', boxes: [] };
    const tops = MODEL.components;
    // pack six boxes on a 3 x 2 floor grid, sized to content
    const cols = 3;
    const colW = [], rowH = [];
    const sizeOf = c => {
      const kids = c.children || [];
      const rec = nodes.get(c.id);
      if (!kids.length) return { w: rec.w + 0.3, h: rec.h + 0.3, d: D };
      const kw = kids.reduce((a, k) => a + nodes.get(k.id).w + 0.25, -0.25);
      const kh = Math.max(...kids.map(k => nodes.get(k.id).h));
      return { w: Math.max(rec.w, kw) + 0.7, h: rec.h + 0.4 + kh + 0.7, d: D * 2.6 };
    };
    const sizes = tops.map(sizeOf);
    tops.forEach((c, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      colW[col] = Math.max(colW[col] || 0, sizes[i].w);
      rowH[row] = Math.max(rowH[row] || 0, sizes[i].d);
    });
    const totalW = colW.reduce((a, b) => a + b + 0.7, -0.7);
    const totalD = rowH.reduce((a, b) => a + b + 0.9, -0.9);
    const maxH = Math.max(...sizes.map(s => s.h));
    tops.forEach((c, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const cx = -totalW / 2 + colW.slice(0, col).reduce((a, b) => a + b + 0.7, 0) + colW[col] / 2;
      const cz = totalD / 2 - rowH.slice(0, row).reduce((a, b) => a + b + 0.9, 0) - rowH[row] / 2;
      const s = sizes[i];
      const cy = -maxH / 2 + s.h / 2;
      const rec = nodes.get(c.id);
      const kids = c.children || [];
      if (!kids.length) {
        out.set(c.id, { p: new THREE.Vector3(cx, cy, cz + s.d / 2 - 0.01), q: FRONT.clone() });
      } else {
        out.set(c.id, { p: new THREE.Vector3(cx, cy + s.h / 2 - 0.35 - rec.h / 2, cz + s.d / 2 - 0.01), q: FRONT.clone() });
        const kw = kids.reduce((a, k) => a + nodes.get(k.id).w + 0.25, -0.25);
        const kh = Math.max(...kids.map(k => nodes.get(k.id).h));
        let kx = cx - kw / 2;
        const ky = cy - s.h / 2 + 0.35 + kh / 2;
        for (const k of kids) {
          const kr = nodes.get(k.id);
          out.set(k.id, { p: new THREE.Vector3(kx + kr.w / 2, ky, cz), q: FRONT.clone() });
          decor.boxes.push({ x: kx + kr.w / 2, y: ky, z: cz, w: kr.w + 0.2, h: kr.h + 0.2, d: D, inner: true });
          kx += kr.w + 0.25;
        }
      }
      decor.boxes.push({ x: cx, y: cy, z: cz, w: s.w, h: s.h, d: s.d, label: c.name });
    });
    decor.boxes.push({ x: 0, y: 0, z: 0, w: totalW + 1.2, h: maxH + 1.0, d: totalD + 1.2, workspace: true, label: MODEL.workspace });
    out.set('venue', { p: new THREE.Vector3(-(totalW / 2 + 0.6 + 2.2), -maxH / 2 + measureExternal() * PX / 2, 0), q: facing(Math.PI / 2) });
    return { out, decor };
  }

  function layoutFlat() {
    const out = new Map();
    const GAP = 0.8;
    const cols = {};
    for (const c of MODEL.components) (cols[MODEL.stage[c.id]] = cols[MODEL.stage[c.id]] || []).push(c);
    const stages = Object.keys(cols).map(Number).sort((a, b) => a - b);
    const colWidth = s => Math.max(...cols[s].map(c => {
      const kids = c.children || [];
      return kids.length ? Math.max(nodes.get(c.id).w, kids.length > 2 ? 2 * (W * PX) + 0.25 : kids.length * (W * PX)) : nodes.get(c.id).w;
    }));
    const total = stages.reduce((a, s) => a + colWidth(s) + GAP, W * PX + GAP) - GAP;
    let x = -total / 2;
    out.set('venue', { p: new THREE.Vector3(x + W * PX / 2, 0, 0), q: FRONT.clone() });
    x += W * PX + GAP;
    for (const s of stages) {
      const cw = colWidth(s);
      const items = cols[s];
      const heights = items.map(c => {
        const kids = c.children || [];
        if (!kids.length) return nodes.get(c.id).h;
        const rows = Math.ceil(kids.length / 2);
        const kh = Math.max(...kids.map(k => nodes.get(k.id).h));
        return nodes.get(c.id).h + 0.3 + rows * (kh + 0.25);
      });
      const colH = heights.reduce((a, b) => a + b + GAP, -GAP);
      let y = colH / 2;
      items.forEach((c, i) => {
        const rec = nodes.get(c.id);
        const kids = c.children || [];
        out.set(c.id, { p: new THREE.Vector3(x + cw / 2, y - rec.h / 2, 0), q: FRONT.clone() });
        let ky = y - rec.h - 0.3;
        const kh = kids.length ? Math.max(...kids.map(k => nodes.get(k.id).h)) : 0;
        kids.forEach((k, j) => {
          const kr = nodes.get(k.id);
          const perRow = Math.min(2, kids.length);
          const rowW = perRow * kr.w + (perRow - 1) * 0.25;
          const kx = x + cw / 2 - rowW / 2 + (j % 2) * (kr.w + 0.25) + kr.w / 2;
          const row = Math.floor(j / 2);
          out.set(k.id, { p: new THREE.Vector3(kx, ky - row * (kh + 0.25) - kr.h / 2, 0.02), q: FRONT.clone() });
        });
        y -= heights[i] + GAP;
      });
      x += cw + GAP;
    }
    return { out, decor: { kind: 'flat' } };
  }

  const LAYOUTS = { cone: layoutCone, sheets: layoutSheets, cube: layoutCube, flat: layoutFlat };

  // ---------- decor ----------
  function clearGroup(g) { while (g.children.length) { const c = g.children[0]; g.remove(c); } }
  function glassMat(color, opacity) {
    return new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false });
  }
  function buildDecor(decor) {
    clearGroup(decorGroup);
    const glass = new THREE.Color(P.glass);
    const frame = new THREE.Color(P.frame);
    const lineMat = new THREE.LineBasicMaterial({ color: frame, transparent: true, opacity: 0.9 });
    if (decor.kind === 'cone') {
      const topH = Math.max(...MODEL.components.map(c => nodes.get(c.id).h)) / 2 + 0.6;
      const botY = Math.min(...decor.rings.map(r => r.y - 1.6), -2.4);
      // the workspace frame, now a cylinder
      const cyl = new THREE.Mesh(new THREE.CylinderGeometry(decor.R * 0.985, decor.R * 0.985, topH - botY, 72, 1, true), glassMat(glass, P.dark ? 0.07 : 0.05));
      cyl.position.y = (topH + botY) / 2;
      decorGroup.add(cyl);
      // rim lines
      for (const y of [topH, botY]) {
        const pts = []; for (let i = 0; i <= 72; i++) { const a = i / 72 * Math.PI * 2; pts.push(new THREE.Vector3(Math.sin(a) * decor.R, y, Math.cos(a) * decor.R)); }
        decorGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat));
      }
      // axis
      const axis = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, topH + 0.6, 0), new THREE.Vector3(0, botY, 0)]),
        new THREE.LineDashedMaterial({ color: frame, dashSize: 0.12, gapSize: 0.08 }));
      axis.computeLineDistances();
      decorGroup.add(axis);
      const title = textSprite('workspace  ' + MODEL.workspace, P.muted, P, 11);
      title.position.set(0, topH + 0.85, 0);
      decorGroup.add(title);
      // cone struts and child rings
      const strut = new THREE.LineBasicMaterial({ color: frame, transparent: true, opacity: 0.8 });
      for (const r of decor.rings) {
        if (r.r > 0) {
          const pts = []; for (let i = 0; i <= 48; i++) { const a = i / 48 * Math.PI * 2; pts.push(new THREE.Vector3(r.cx + Math.sin(a) * r.r, r.y, r.cz + Math.cos(a) * r.r)); }
          decorGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat));
        }
      }
      // floor: the tree's shadow, the 2D map for free
      const floorY = botY - 0.9;
      const disc = new THREE.Mesh(new THREE.CircleGeometry(decor.R * 2.4, 96), glassMat(new THREE.Color(P.shadow), P.dark ? 0.12 : 0.05));
      disc.rotation.x = -Math.PI / 2; disc.position.y = floorY;
      decorGroup.add(disc);
      decor.floorY = floorY;
      decor.shadowGroup = new THREE.Group();
      decorGroup.add(decor.shadowGroup);
    }
    if (decor.kind === 'sheets') {
      for (const s of decor.sheets) {
        const m = new THREE.Mesh(new THREE.PlaneGeometry(s.w, s.h), glassMat(s.external ? new THREE.Color(P.muted) : glass, P.dark ? 0.10 : 0.07));
        m.position.set(s.x, s.y, s.z - 0.03);
        decorGroup.add(m);
        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(s.w, s.h)), lineMat);
        edges.position.copy(m.position);
        decorGroup.add(edges);
        const lab = textSprite((s.external ? 'outside · ' : 'stage ' + s.stage + ' · ') + s.label, P.muted, P, 10);
        lab.position.set(s.x - s.w / 2 + lab.scale.x / 2 + 0.05, s.y + s.h / 2 + 0.16, s.z);
        decorGroup.add(lab);
      }
    }
    if (decor.kind === 'cube') {
      for (const b of decor.boxes) {
        const geo = new THREE.BoxGeometry(b.w, b.h, b.d);
        const m = new THREE.Mesh(geo, glassMat(b.workspace ? new THREE.Color(P.frame) : glass, b.workspace ? (P.dark ? 0.06 : 0.05) : b.inner ? 0.10 : 0.09));
        m.position.set(b.x, b.y, b.z);
        m.renderOrder = b.workspace ? 1 : b.inner ? 3 : 2;
        decorGroup.add(m);
        const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMat);
        e.position.copy(m.position);
        decorGroup.add(e);
        if (b.label) {
          const lab = textSprite((b.workspace ? 'workspace  ' : '') + b.label, P.muted, P, b.workspace ? 11 : 10);
          lab.position.set(b.x - b.w / 2 + lab.scale.x / 2 + 0.05, b.y + b.h / 2 + 0.16, b.z + b.d / 2);
          decorGroup.add(lab);
        }
      }
    }
    if (decor.kind === 'flat') {
      const tops = MODEL.components.map(c => nodes.get(c.id).target.p);
      const allIn = [...nodes.values()].filter(r => !r.isExternal).map(r => r.target);
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const t of allIn) {
        const r = [...nodes.values()].find(n => n.target === t);
        minX = Math.min(minX, t.p.x - r.w / 2); maxX = Math.max(maxX, t.p.x + r.w / 2);
        minY = Math.min(minY, t.p.y - r.h / 2); maxY = Math.max(maxY, t.p.y + r.h / 2);
      }
      const w = maxX - minX + 1.0, h = maxY - minY + 1.4;
      const frameMesh = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, h)), lineMat);
      frameMesh.position.set((minX + maxX) / 2, (minY + maxY) / 2 + 0.2, -0.05);
      decorGroup.add(frameMesh);
      const lab = textSprite('workspace  ' + MODEL.workspace, P.muted, P, 11);
      lab.position.set(minX - 0.5 + lab.scale.x / 2 + 0.1, maxY + 0.9 - 0.18, 0);
      decorGroup.add(lab);
      void tops;
    }
  }

  // ---------- edges ----------
  function worldPos(id, family) {
    const rec = nodes.get(id);
    const m = rec.mesh;
    const off = family === 'call' ? rec.h * 0.28 : family === 'deny' ? -rec.h * 0.28 : 0;
    const v = new THREE.Vector3(0, off, 0);
    return m.localToWorld(v);
  }
  function outwardNormal(id) {
    const m = nodes.get(id).mesh;
    return new THREE.Vector3(0, 0, 1).applyQuaternion(m.getWorldQuaternion(new THREE.Quaternion()));
  }

  let currentDecorKind = 'cone';
  function buildEdges() {
    clearGroup(edgeGroup);
    const edgeColor = new THREE.Color(P.box);
    const denyColor = new THREE.Color(P.deny);
    const solid = new THREE.LineBasicMaterial({ color: edgeColor });
    const dashed = new THREE.LineDashedMaterial({ color: edgeColor, dashSize: 0.14, gapSize: 0.09 });
    const entryMat = new THREE.LineDashedMaterial({ color: edgeColor, dashSize: 0.06, gapSize: 0.06 });
    const denyMat = new THREE.LineDashedMaterial({ color: denyColor, dashSize: 0.14, gapSize: 0.09 });
    const origin = new THREE.Vector3();
    root.getWorldPosition(origin);

    function curve(a, b, family) {
      const mid = a.clone().add(b).multiplyScalar(0.5);
      const pull = currentDecorKind === 'cone' ? 0.45 : currentDecorKind === 'flat' ? 0 : 0.15;
      const ctrl = mid.clone().lerp(origin, pull);
      if (currentDecorKind === 'flat') ctrl.z += family === 'call' ? 0.45 : family === 'flow' ? 0.2 : 0.35;
      if (currentDecorKind === 'sheets') ctrl.y += 0.25;
      return new THREE.QuadraticBezierCurve3(a, ctrl, b);
    }
    function arrow(cv, color) {
      const tip = cv.getPoint(1), t = cv.getTangent(1).normalize();
      const cone = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.18, 10), new THREE.MeshBasicMaterial({ color }));
      cone.position.copy(tip).addScaledVector(t, -0.09);
      cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), t);
      return cone;
    }
    function shrink(a, b, byA, byB) {
      const d = b.clone().sub(a); const len = d.length(); d.normalize();
      return [a.clone().addScaledVector(d, Math.min(byA, len * 0.3)), b.clone().addScaledVector(d, -Math.min(byB, len * 0.3))];
    }

    for (const [from, to, family, label] of MODEL.edges) {
      const a0 = worldPos(from, family), b0 = worldPos(to, family);
      const [a, b] = shrink(a0, b0, 0.35, 0.42);
      const cv = curve(a, b, family);
      const pts = cv.getPoints(40);
      const mat = family === 'call' ? solid : family === 'entry' ? entryMat : dashed;
      const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat);
      if (mat.isLineDashedMaterial) line.computeLineDistances();
      edgeGroup.add(line, arrow(cv, edgeColor));
      if (label) {
        const sp = textSprite(label, P.sub, P, 9, P.ground);
        sp.position.copy(cv.getPoint(0.5));
        edgeGroup.add(sp);
      }
    }
    // deny: a per-rule "any" marker, a barred red line into the target
    for (const rule of MODEL.deny) {
      const t = worldPos(rule.target, 'deny');
      const n = outwardNormal(rule.target);
      const side = new THREE.Vector3(0, 1, 0).cross(n).normalize();
      const anyPos = t.clone().addScaledVector(n, 1.9).addScaledVector(side, -0.9).add(new THREE.Vector3(0, -0.5, 0));
      const marker = new THREE.Mesh(new THREE.SphereGeometry(0.11, 14, 10), new THREE.MeshBasicMaterial({ color: new THREE.Color(P.cap) }));
      marker.position.copy(anyPos);
      const ring = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.SphereGeometry(0.11, 8, 6)), new THREE.LineBasicMaterial({ color: new THREE.Color(P.chipStroke) }));
      ring.position.copy(anyPos);
      const star = textSprite('*', P.ink, P, 12);
      star.position.copy(anyPos);
      const [a, b] = shrink(anyPos, t, 0.14, 0.3);
      const cv = new THREE.QuadraticBezierCurve3(a, a.clone().lerp(b, 0.5), b);
      const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(cv.getPoints(12)), denyMat);
      line.computeLineDistances();
      // the bar: a short perpendicular stroke near the target end
      const end = cv.getPoint(0.92), tan = cv.getTangent(0.92).normalize();
      const perp = tan.clone().cross(n).normalize().multiplyScalar(0.16);
      if (perp.lengthSq() < 1e-6) perp.set(0, 0.16, 0);
      const bar = new THREE.Line(new THREE.BufferGeometry().setFromPoints([end.clone().add(perp), end.clone().sub(perp)]), new THREE.LineBasicMaterial({ color: denyColor, linewidth: 2 }));
      const lab = textSprite('except ' + rule.except, P.denyText, P, 9, P.ground);
      lab.position.copy(cv.getPoint(0.45)).add(new THREE.Vector3(0, -0.16, 0));
      edgeGroup.add(marker, ring, star, line, bar, lab);
    }
  }

  // shadow dots under the cone tree
  function buildShadows(decor) {
    if (decor.kind !== 'cone' || !decor.shadowGroup) return;
    clearGroup(decor.shadowGroup);
    const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(P.shadow), transparent: true, opacity: P.dark ? 0.35 : 0.18, depthWrite: false });
    for (const rec of nodes.values()) {
      const p = rec.mesh.position;
      const q = rec.mesh.quaternion;
      const m = new THREE.Mesh(new THREE.PlaneGeometry(rec.w, 0.12), mat);
      m.position.set(p.x, decor.floorY + 0.01, p.z);
      m.rotation.x = -Math.PI / 2;
      m.rotation.z = -new THREE.Euler().setFromQuaternion(q, 'YXZ').y;
      decor.shadowGroup.add(m);
    }
  }

  // ---------- camera + orbit ----------
  const orbit = { az: 0.55, el: 0.28, dist: 15, target: new THREE.Vector3(0, -0.6, 0) };
  const VIEWS = {
    cone: { az: 0.45, el: 0.18 },
    sheets: { az: 0.50, el: 0.22 },
    cube: { az: 0.42, el: 0.20 },
    flat: { az: 0, el: 0 }
  };

  // fitView: computes a world-space bounding box over the current layout's content
  // (panes + decor), then projects that box onto the camera's actual screen axes for
  // the layout's az/el, and derives the distance/target that keeps everything on
  // screen, clear of the top bar and bottom-left caption panel. A bounding-sphere fit
  // overshoots badly on wide, shallow scenes (e.g. the cube layout's 3x2 grid), so this
  // fits the projected extents instead.
  const PAD = 1.04;

  // projects the 8 world-space corners of the content box through a candidate
  // camera placement (dist + target, at this layout's fixed az/el) and returns
  // the largest absolute NDC x and y across them — i.e. how big the actual
  // silhouette would be on screen, not the worst-case analytic bound.
  function projectedExtent(dist, target, az, el, corners) {
    fitCam.position.set(
      target.x + dist * Math.sin(az) * Math.cos(el),
      target.y + dist * Math.sin(el),
      target.z + dist * Math.cos(az) * Math.cos(el)
    );
    fitCam.lookAt(target);
    fitCam.updateMatrixWorld(true);
    let mx = 0, my = 0;
    const v = new THREE.Vector3();
    for (const c of corners) {
      v.copy(c).project(fitCam);
      mx = Math.max(mx, Math.abs(v.x));
      my = Math.max(my, Math.abs(v.y));
    }
    return { mx, my };
  }

  // binary search for the smallest dist whose projected silhouette still fits
  // inside [threshX, threshY]; projected size shrinks monotonically as dist
  // grows, so this converges on the closest camera position that still fits —
  // i.e. the frame filled as much as possible without clipping. Returns null
  // if even the far end of the search range doesn't fit (degenerate scene),
  // so the caller can fall back to the analytic bound instead.
  function solveDist(target, az, el, corners, threshX, threshY) {
    let lo = 2, hi = 80;
    const atHi = projectedExtent(hi, target, az, el, corners);
    if (atHi.mx > threshX || atHi.my > threshY) return null;
    const atLo = projectedExtent(lo, target, az, el, corners);
    if (atLo.mx <= threshX && atLo.my <= threshY) return lo;
    for (let i = 0; i < 24; i++) {
      const mid = (lo + hi) / 2;
      const e = projectedExtent(mid, target, az, el, corners);
      if (e.mx <= threshX && e.my <= threshY) hi = mid; else lo = mid;
    }
    return hi;
  }

  function fitView(k) {
    const angles = VIEWS[k];
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, minZ = Infinity, maxZ = -Infinity;
    const grow = (cx, cy, cz, hx, hy, hz) => {
      minX = Math.min(minX, cx - hx); maxX = Math.max(maxX, cx + hx);
      minY = Math.min(minY, cy - hy); maxY = Math.max(maxY, cy + hy);
      minZ = Math.min(minZ, cz - hz); maxZ = Math.max(maxZ, cz + hz);
    };
    for (const rec of nodes.values()) {
      const p = rec.target.p;
      // panes are vertical and only rotate about Y: their horizontal extent never
      // exceeds w/2 (in X and Z alike) and their vertical extent is exactly h/2.
      grow(p.x, p.y, p.z, rec.w / 2, rec.h / 2, rec.w / 2);
    }
    if (decor.kind === 'cone') {
      minX = Math.min(minX, -decor.R); maxX = Math.max(maxX, decor.R);
      minZ = Math.min(minZ, -decor.R); maxZ = Math.max(maxZ, decor.R);
      if (decor.floorY !== undefined) minY = Math.min(minY, decor.floorY);
    } else if (decor.kind === 'cube') {
      const ws = decor.boxes.find(b => b.workspace);
      if (ws) grow(ws.x, ws.y, ws.z, ws.w / 2, ws.h / 2, ws.d / 2);
    } else if (decor.kind === 'sheets') {
      for (const s of decor.sheets) grow(s.x, s.y, s.z, s.w / 2, s.h / 2, 0);
    }
    const center = new THREE.Vector3((minX + maxX) / 2, (minY + maxY) / 2, (minZ + maxZ) / 2);
    const hx = (maxX - minX) / 2, hy = (maxY - minY) / 2, hz = (maxZ - minZ) / 2;

    // camera basis for this layout's az/el, matching applyCamera's convention
    const dir = new THREE.Vector3(Math.sin(angles.az) * Math.cos(angles.el), Math.sin(angles.el), Math.cos(angles.az) * Math.cos(angles.el)).normalize();
    const worldUp = new THREE.Vector3(0, 1, 0);
    const right = new THREE.Vector3().crossVectors(worldUp, dir).normalize();
    const up = new THREE.Vector3().crossVectors(dir, right);

    let halfW = 0, halfH = 0, halfD = 0;
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) {
      const corner = new THREE.Vector3(sx * hx, sy * hy, sz * hz);
      halfW = Math.max(halfW, Math.abs(corner.dot(right)));
      halfH = Math.max(halfH, Math.abs(corner.dot(up)));
      halfD = Math.max(halfD, Math.abs(corner.dot(dir)));
    }

    const vFov = THREE.MathUtils.degToRad(camera.fov);
    const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);

    // shrink to the rect actually free of overlays: the top bar always eats its
    // measured height (it wraps to two rows on a narrow viewport, so measure live,
    // not a constant), and the bottom-left caption eats its height too, but only
    // when it's expanded and wide enough to span most of the frame — otherwise
    // content can sit to its right and the bottom is left alone.
    const fullW = stage.clientWidth, fullH = stage.clientHeight;
    const barH = document.querySelector('.bar').getBoundingClientRect().height;
    let capH = 0;
    if (captionExpanded) {
      const capRect = document.getElementById('caption').getBoundingClientRect();
      if (capRect.width > fullW * 0.45) capH = capRect.height;
    }
    const usableW = fullW;
    const usableH = Math.max(1, fullH - barH - capH);
    const threshX = (usableW / fullW) / PAD;
    const threshY = (usableH / fullH) / PAD;

    // analytic fallback (the old worst-case-projection formula), used only if
    // the iterative solve below can't find a fitting distance in its search range
    function analyticFallback() {
      let d = Math.max(halfH / Math.tan(vFov / 2), halfW / Math.tan(hFov / 2)) + halfD;
      d *= PAD;
      d *= Math.max(fullW / usableW, fullH / usableH);
      return Math.max(5, Math.min(60, d));
    }

    fitCam.fov = camera.fov; fitCam.aspect = camera.aspect; fitCam.near = camera.near; fitCam.far = camera.far;
    fitCam.updateProjectionMatrix();
    const corners = [];
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) {
      corners.push(new THREE.Vector3(center.x + sx * hx, center.y + sy * hy, center.z + sz * hz));
    }

    // pass 1: solve distance against the un-recentred target (the bbox center)
    let dist = solveDist(center, angles.az, angles.el, corners, threshX, threshY);
    if (dist === null) dist = analyticFallback();

    // recenter: the usable rect's on-screen center is offset from the full canvas's,
    // so shift the look-at target (in screen space, then converted to world units at
    // the fit distance) rather than centering on the full canvas.
    const target = center.clone();
    const worldPerPx = 2 * dist * Math.tan(vFov / 2) / fullH;
    const offsetX = 0; // both cuts above are full-width, so there's no horizontal skew
    const offsetY = (barH - capH) / 2;
    target.addScaledVector(right, -offsetX * worldPerPx);
    target.addScaledVector(up, offsetY * worldPerPx);

    // pass 2: resolve distance against the recentred target
    const dist2 = solveDist(target, angles.az, angles.el, corners, threshX, threshY);
    if (dist2 !== null) dist = dist2;

    dist = Math.max(3, Math.min(80, dist));
    return { az: angles.az, el: angles.el, dist, target };
  }
  function applyCamera() {
    const { az, el, dist, target } = orbit;
    camera.position.set(target.x + dist * Math.sin(az) * Math.cos(el), target.y + dist * Math.sin(el), target.z + dist * Math.cos(az) * Math.cos(el));
    camera.lookAt(target);
  }
  const cv = renderer.domElement;
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: false }; cv.setPointerCapture(e.pointerId); cv.classList.add('dragging'); });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    orbit.az -= dx * 0.006; orbit.el = Math.max(-1.2, Math.min(1.35, orbit.el + dy * 0.005));
    drag.x = e.clientX; drag.y = e.clientY;
    applyCamera();
  });
  cv.addEventListener('pointerup', e => {
    cv.classList.remove('dragging');
    if (drag && !drag.moved) pick(e);
    drag = null;
  });
  cv.addEventListener('wheel', e => { e.preventDefault(); orbit.dist = Math.max(5, Math.min(45, orbit.dist * (1 + Math.sign(e.deltaY) * 0.08))); applyCamera(); }, { passive: false });

  // ---------- click: swing a box to the front (the cone tree's signature move) ----------
  const ray = new THREE.Raycaster();
  let spin = null;
  function pick(e) {
    const r = cv.getBoundingClientRect();
    const m = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(m, camera);
    const hit = ray.intersectObjects(paneGroup.children, false)[0];
    if (!hit) return;
    const p = hit.object.position;
    const theta = Math.atan2(p.x, p.z);
    let goal = orbit.az - theta;
    let cur = root.rotation.y;
    let delta = ((goal - cur + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
    if (reducedMotion()) { root.rotation.y = cur + delta; return; }
    spin = { from: cur, to: cur + delta, t0: performance.now(), dur: 650 };
  }
  function reducedMotion() { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

  // ---------- layout switching ----------
  let decor = null;
  let tween = null;
  let currentLayout = 'cone';
  const CAPTIONS = {
    cone: {
      title: 'Cone tree', tag: 'Robertson, Mackinlay, Card · 1991',
      body: 'The workspace frame becomes a cylinder. Top-level components sit on its surface, angle set by declaration order, so the layout is deterministic and stable across runs. Nested components hang as a smaller ring under their parent. The exchange sits outside the cylinder: inside the frame still means part of the system.',
      depth: 'depth carries: containment only · edges attach by family: calls high, data flows mid, deny low · click a box to swing it to the front · the disc below is the tree’s shadow, the 2D map for free'
    },
    sheets: {
      title: 'Stacked sheets', tag: '2.5D clustered layout · Dwyer & Eades',
      body: 'Each top-level component is laid out flat on its own glass sheet. Sheets are ordered by where the component sits in the flow, computed as the longest path from the exchange, so depth means pipeline stage. An edge that crosses sheets is an edge that crosses a stage.',
      depth: 'depth carries: pipeline stage (0 exchange → 4 risk, gateway, pnl) · every pane faces you, nothing needs rotating'
    },
    cube: {
      title: 'Nested glass', tag: 'Information Cube · Rekimoto & Green · 1993',
      body: 'Containment is literal. A component is a glass box, nested components are boxes inside it, the workspace is the outer box, and the exchange stands outside. Nothing can hide because everything is glass; a red mark deep inside would still be visible from any side.',
      depth: 'depth carries: containment · boxes are sized to content, not to a metric · orbit to see through the layers'
    },
    flat: {
      title: 'Flat', tag: 'the same boxes in one plane',
      body: 'For comparison: the boxes in a single plane, columns by flow stage. This is roughly what the static renderer draws today. Notice how the call, data flow and deny edges compete for the same space between the same boxes.',
      depth: 'depth carries: nothing · edges lift off the plane only so they do not overlap'
    }
  };
  function setCaption(k) {
    const c = CAPTIONS[k];
    document.getElementById('captionTitle').innerHTML = `${c.title}<small>${c.tag}</small>`;
    document.getElementById('captionBody').innerHTML = `<p>${c.body}</p><div class="depth">${c.depth}</div>`;
  }

  // ---------- caption collapse: expanded by default on a roomy viewport, collapsed on a
  // narrow one (where it can eat a third of the frame); a manual toggle overrides that
  // default for the rest of the session, until the page reloads ----------
  let captionExpanded = false;
  let captionManual = null;
  function defaultCaptionExpanded() { return window.innerWidth >= 1100 && window.innerHeight >= 700; }
  function applyCaptionState(expanded) {
    captionExpanded = expanded;
    document.getElementById('caption').classList.toggle('collapsed', !expanded);
    document.getElementById('captionBody').hidden = !expanded;
    const btn = document.getElementById('captionToggle');
    btn.setAttribute('aria-expanded', String(expanded));
    btn.textContent = expanded ? '×' : 'i';
    btn.setAttribute('aria-label', expanded ? 'Collapse caption' : 'Expand caption');
  }
  document.getElementById('captionToggle').addEventListener('click', () => {
    captionManual = !captionExpanded;
    applyCaptionState(captionManual);
    if (decor && !tween) {
      const v = fitView(currentLayout);
      Object.assign(orbit, { az: v.az, el: v.el, dist: v.dist });
      orbit.target.copy(v.target);
      applyCamera();
    }
  });

  function applyLayout(k, animate) {
    currentLayout = k;
    const { out, decor: d } = LAYOUTS[k]();
    decor = d;
    currentDecorKind = d.kind;
    for (const [id, t] of out) nodes.get(id).target = t;
    buildDecor(decor);
    setCaption(k);
    if (captionManual === null) applyCaptionState(defaultCaptionExpanded());
    const v = fitView(k);
    const camFrom = { az: orbit.az, el: orbit.el, dist: orbit.dist, target: orbit.target.clone() };
    const rotFrom = root.rotation.y;
    if (!animate || reducedMotion()) {
      for (const rec of nodes.values()) { rec.mesh.position.copy(rec.target.p); rec.mesh.quaternion.copy(rec.target.q); }
      root.rotation.y = 0;
      Object.assign(orbit, { az: v.az, el: v.el, dist: v.dist }); orbit.target.copy(v.target);
      applyCamera(); buildEdges(); buildShadows(decor);
      return;
    }
    const from = new Map();
    for (const rec of nodes.values()) from.set(rec.node.id, { p: rec.mesh.position.clone(), q: rec.mesh.quaternion.clone() });
    tween = { t0: performance.now(), dur: 750, from, camFrom, rotFrom, view: v };
  }

  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    applyLayout(b.dataset.layout, true);
  }));

  // ---------- theme ----------
  function rebuildForTheme() {
    P = palette();
    scene.background = new THREE.Color(P.ground);
    buildPanes();
    for (const rec of nodes.values()) { rec.mesh.position.copy(rec.target.p); rec.mesh.quaternion.copy(rec.target.q); }
    buildDecor(decor); buildEdges(); buildShadows(decor);
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rebuildForTheme);
  new MutationObserver(rebuildForTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ---------- frame loop ----------
  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    if (decor && !tween) {
      const v = fitView(currentLayout);
      Object.assign(orbit, { az: v.az, el: v.el, dist: v.dist });
      orbit.target.copy(v.target);
      applyCamera();
    }
  }
  window.addEventListener('resize', resize);

  function frame(now) {
    let dirty = false;
    if (tween) {
      const t = Math.min(1, (now - tween.t0) / tween.dur), e = ease(t);
      for (const rec of nodes.values()) {
        const f = tween.from.get(rec.node.id);
        rec.mesh.position.lerpVectors(f.p, rec.target.p, e);
        rec.mesh.quaternion.slerpQuaternions(f.q, rec.target.q, e);
      }
      root.rotation.y = tween.rotFrom * (1 - e);
      const v = tween.view, c = tween.camFrom;
      orbit.az = c.az + (v.az - c.az) * e; orbit.el = c.el + (v.el - c.el) * e; orbit.dist = c.dist + (v.dist - c.dist) * e;
      orbit.target.lerpVectors(c.target, v.target, e);
      applyCamera();
      dirty = true;
      if (t >= 1) { tween = null; buildShadows(decor); }
    }
    if (spin) {
      const t = Math.min(1, (now - spin.t0) / spin.dur);
      root.rotation.y = spin.from + (spin.to - spin.from) * ease(t);
      dirty = true;
      if (t >= 1) spin = null;
    }
    if (dirty) buildEdges();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // ---------- go ----------
  function start() {
    P = palette();
    scene.background = new THREE.Color(P.ground);
    resize();
    buildPanes();
    applyLayout('cone', false);
    requestAnimationFrame(frame);
  }
  const fontsReady = document.fonts ? Promise.all([
    document.fonts.load('600 13px "IBM Plex Mono"'), document.fonts.load('10px "IBM Plex Mono"'), document.fonts.load('italic 10px "IBM Plex Mono"')
  ]).catch(() => {}) : Promise.resolve();
  fontsReady.then(start);
})();
</script>
