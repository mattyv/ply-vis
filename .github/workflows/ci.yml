name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  playwright:
    name: Browser and webview tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  vscode:
    name: VS Code extension-host smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @ply/vis
      - name: Run extension-host smoke under Xvfb
        run: xvfb-run -a npm run test:extension
      - name: Package VS Code extension
        run: npm run package:local
      - name: Upload VS Code extension
        uses: actions/upload-artifact@v4
        with:
          name: ply-vscode-extension
          path: ply-vis-*.vsix
          if-no-files-found: error

  jetbrains:
    name: JetBrains tests and plugin build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @ply/vis
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Configure external build caches
        run: |
          echo "GRADLE_USER_HOME=$HOME/.gradle" >> "$GITHUB_ENV"
          echo "PLY_VIS_CACHE_HOME=$HOME/.cache/ply-vis" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the JetBrains plugin
        working-directory: packages/jetbrains
        run: ./gradlew clean test buildPlugin
      - name: Upload JetBrains plugin
        uses: actions/upload-artifact@v4
        with:
          name: ply-jetbrains-plugin
          path: packages/jetbrains/build/distributions/*.zip
          if-no-files-found: error

  release:
    name: Publish tagged packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [node, playwright, vscode, jetbrains]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ply-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
