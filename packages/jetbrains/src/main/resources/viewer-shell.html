<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'none'; style-src 'nonce-{{NONCE}}'; script-src 'nonce-{{NONCE}}' blob:; font-src 'none'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <style nonce="{{NONCE}}">{{STYLES}}</style>
  <title>Ply Visual</title>
</head>
<body data-ply-jetbrains="true">
  <div id="root"></div>
  <script nonce="{{NONCE}}">
    let viewer;
    async function bootPlyViewer() {
      if (viewer || !window.__plyHost) return;
      const source = Uint8Array.from(atob('{{MODULE_BASE64}}'), character => character.charCodeAt(0));
      const moduleUrl = URL.createObjectURL(new Blob([source], {type: 'text/javascript'}));
      try {
        const {mountViewer} = await import(moduleUrl);
        viewer = mountViewer(document.querySelector('#root'), {
          post(message) { window.__plyHost.postMessage(message); },
        });
        window.__plyViewer = viewer;
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        document.querySelector('#root').textContent = `Ply viewer failed to start: ${message}`;
        window.__plyHost.postMessage({channel: 'ply-vis', version: 1, type: 'error', message});
      } finally {
        URL.revokeObjectURL(moduleUrl);
      }
    }
    window.addEventListener('ply-host-ready', () => void bootPlyViewer());
    void bootPlyViewer();
  </script>
</body>
</html>
